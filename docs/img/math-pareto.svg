<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 326" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="780" height="326" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#111827">4 · The cost / quality frontier (what the slider navigates)</text>

  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="710" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="74" y="56" font-size="11" fill="#6b7280" text-anchor="end">quality</text>
  <text x="716" y="244" font-size="11" fill="#6b7280">cost →</text>
  <text x="40" y="155" font-size="11" fill="#6b7280" transform="rotate(-90 40 155)" text-anchor="middle">mean judge quality</text>
  <text x="395" y="270" font-size="11" fill="#6b7280" text-anchor="middle">escalation rate  (fraction sent to the expensive tier = cost proxy)</text>

  <!-- efficient frontier polyline: c0 -> c1 -> c2 -->
  <polyline points="204,207 359,150 526,76" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- projection: "I want ~90% of best quality" -> read cost off the curve -->
  <line x1="80" y1="109" x2="452" y2="109" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="452" y1="109" x2="452" y2="240" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="452" cy="109" r="4" fill="#111827"/>
  <text x="92" y="103" font-size="10.5" fill="#374151">target: 90% of best quality</text>
  <text x="458" y="234" font-size="10.5" fill="#374151">→ projected cost ≈ 60%</text>

  <!-- efficient points -->
  <circle cx="204" cy="207" r="6" fill="#2563eb"/>
  <text x="204" y="226" font-size="10.5" fill="#1e3a8a" text-anchor="middle">cluster-0</text>
  <circle cx="359" cy="150" r="6" fill="#2563eb"/>
  <text x="359" y="140" font-size="10.5" fill="#1e3a8a" text-anchor="middle">cluster-1</text>
  <circle cx="526" cy="76" r="6" fill="#2563eb"/>
  <text x="526" y="66" font-size="10.5" fill="#1e3a8a" text-anchor="middle">cluster-2 (best quality)</text>

  <!-- dominated point -->
  <circle cx="626" cy="134" r="6" fill="#9ca3af"/>
  <text x="760" y="132" font-size="10.5" fill="#6b7280" text-anchor="end">cluster-3 — dominated</text>
  <text x="760" y="150" font-size="9.5" fill="#9ca3af" text-anchor="end">(costs more than cluster-2, less quality → trim)</text>

  <text x="80" y="296" font-size="11" fill="#6b7280">The frontier = the points you can't beat on both axes; the slider interpolates along it.</text>
  <text x="80" y="312" font-size="11" fill="#6b7280">A leave-one-out back-test checks the fit predicts each held-out cluster within its 95% CI.</text>
</svg>
