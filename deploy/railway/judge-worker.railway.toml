# Railway config for the `judge-worker` service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/judge-worker.Dockerfile"

[deploy]
# Default panel: Anthropic Haiku. Switch via Railway UI -> Settings -> Start
# Command if you want to rotate to a Groq or OpenAI panel.
startCommand = "cascadia-judge-poll --provider anthropic --model claude-haiku-4-5"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
