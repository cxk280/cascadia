# Railway config for the `dashboard-api` service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/dashboard-api.Dockerfile"

[deploy]
startCommand = "cascadia-dashboard-api"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
