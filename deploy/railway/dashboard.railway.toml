# Railway config for the `dashboard` (Next.js) service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/dashboard.Dockerfile"

[deploy]
# server.js is emitted by Next.js `output: "standalone"`.
startCommand = "/nodejs/bin/node server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
