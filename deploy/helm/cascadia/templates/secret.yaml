{{- if not .Values.existingSecret -}}
{{/*
  Guard: at least one provider API key (or an existingSecret) is required.
  Without this, a bare `helm install ./deploy/helm/cascadia` renders a Secret
  with no stringData entries — valid YAML, valid Secret object — and the
  proxy's referenced env vars resolve to empty strings, sending pods into
  CrashLoopBackOff with no upstream credentials.

  `helm lint` and `helm template` both run templates, so this fail fires
  before any cluster sees the install.
*/}}
{{- if and (empty .Values.secrets.openaiApiKey) (empty .Values.secrets.anthropicApiKey) (empty .Values.secrets.groqApiKey) (empty .Values.secrets.xaiApiKey) -}}
{{- fail (printf "\n\ncascadia: no upstream provider API key was set.\n\nSet at least one of:\n  --set secrets.openaiApiKey=...\n  --set secrets.anthropicApiKey=...\n  --set secrets.groqApiKey=...\n  --set secrets.xaiApiKey=...\nOR point existingSecret at a pre-created Secret carrying the CASCADIA_*_API_KEY keys:\n  --set existingSecret=my-cascadia-secrets\n\nThe pre-created Secret path is strongly recommended for production — see deploy/helm/cascadia/README.md TL;DR.\n") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cascadia.secretName" . }}
  labels:
    {{- include "cascadia.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.openaiApiKey }}
  CASCADIA_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  CASCADIA_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.groqApiKey }}
  CASCADIA_GROQ_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.xaiApiKey }}
  CASCADIA_XAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  CASCADIA_DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
