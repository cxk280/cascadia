name: Bug report
description: Something in Cascadia isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before you submit, please:
        - Check that your issue isn't a known limitation in [PLAN.md §9](../../PLAN.md) (e.g., streaming is intentionally deferred).
        - Search existing issues for duplicates.
        - For security findings, **do not** open a public issue — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Plain-language description of the problem.
      placeholder: When I do X, I expect Y, but instead I see Z.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Minimum steps to reproduce, ideally as a copy-pastable shell session.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA / release
      placeholder: e.g. main@a1b2c3d, or v0.1.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - proxy (Rust)
        - judge-worker
        - policy-controller
        - dashboard-api
        - dashboard (Next.js)
        - docs / methodology blog
        - bench scripts
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Proxy log, judge-worker log, browser console — whichever surfaced the issue.
      render: shell
