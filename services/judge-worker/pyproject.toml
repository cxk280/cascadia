[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascadia-judge"
version = "0.0.1"
description = "Cascadia judge worker — scores shadow-routed response pairs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Chris King", email = "chris@cking.me" }]
dependencies = [
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
cascadia-judge = "cascadia_judge.cli:main"
cascadia-judge-poll = "cascadia_judge.poller_cli:main"
cascadia-judge-calibrate = "cascadia_judge.calibration.cli:main"
cascadia-judge-sample-calibration = "cascadia_judge.calibration.sampler_cli:main"
cascadia-judge-aggregate-labels = "cascadia_judge.calibration.aggregator_cli:main"
cascadia-judge-llm-panel = "cascadia_judge.calibration.llm_panel_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cascadia_judge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
