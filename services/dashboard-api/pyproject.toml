[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascadia-dashboard-api"
version = "0.0.1"
description = "Cascadia read-only HTTP API serving the Next.js dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Chris King", email = "chris@cking.me" }]
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
cascadia-dashboard-api = "cascadia_dashboard.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cascadia_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
