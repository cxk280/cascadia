version: 2.1

# Cascadia CI/CD.
#
#   Every push / PR : build + test (rust, the three python services, dashboard).
#   On `main` only  : deploy to Railway dev (automatic) → staging (manual
#                     approval gate) → prod (manual approval gate).
#
# Railway auth comes from CircleCI project env vars:
#   RAILWAY_API_TOKEN   — a Railway account/team token with access to the project
#                         (the Railway CLI reads this automatically)
#   RAILWAY_PROJECT_ID  — the project id (2b6a4e7f-14d6-496e-847c-9922411dfed3)

executors:
  rust:
    docker:
      - image: cimg/rust:1.83
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
    environment:
      CASCADIA_DATABASE_URL: postgres://cascadia:cascadia@localhost:5432/cascadia
      RUSTFLAGS: "-D warnings"
  python:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
    environment:
      CASCADIA_DATABASE_URL: postgres://cascadia:cascadia@localhost:5432/cascadia
  node:
    docker:
      - image: cimg/node:20.11

jobs:
  rust:
    executor: rust
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
      - run:
          name: Toolchain components
          command: rustup component add clippy rustfmt
      - run:
          name: Format check
          command: cargo fmt --all -- --check
      - run:
          name: Clippy (deny warnings)
          command: cargo clippy --workspace --all-targets -- -D warnings
      - run:
          name: Test
          command: cargo test --workspace --no-fail-fast
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  python:
    executor: python
    parameters:
      service:
        type: string
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install --user uv
      - run:
          name: Sync + test (<< parameters.service >>)
          working_directory: services/<< parameters.service >>
          command: |
            uv sync --extra dev
            uv run pytest -q

  dashboard:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "dashboard/package-lock.json" }}
      - run:
          name: Install deps
          working_directory: dashboard
          command: npm ci
      - run:
          name: Typecheck
          working_directory: dashboard
          command: npm run typecheck
      - run:
          name: Build
          working_directory: dashboard
          command: npm run build
      - save_cache:
          key: npm-v1-{{ checksum "dashboard/package-lock.json" }}
          paths:
            - dashboard/node_modules

  deploy:
    executor: node
    parameters:
      env:
        type: string
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          # cimg/node runs as non-root; global npm install needs sudo
          # (passwordless on cimg images).
          command: sudo npm i -g @railway/cli@latest
      - run:
          name: Deploy services to << parameters.env >>
          command: |
            set -euo pipefail
            : "${RAILWAY_API_TOKEN:?set RAILWAY_API_TOKEN in CircleCI project env vars}"
            : "${RAILWAY_PROJECT_ID:?set RAILWAY_PROJECT_ID in CircleCI project env vars}"
            # Deploy backends first; the dashboard LAST. Its Railway health
            # check is `/` — a server-rendered page that fetches from the
            # backend — so deploying it before the proxy/api finish restarting
            # races the health check and fails the deploy.
            for svc in \
              cascadia-proxy \
              cascadia-dashboard-api \
              cascadia-judge-worker \
              cascadia-policy-controller \
              cascadia-dashboard; do
              echo ">> deploying $svc → << parameters.env >>"
              railway up --ci \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "<< parameters.env >>" \
                --service "$svc"
            done

  # Launcher (cli/) sanity: the bundled demo compose must match the in-tree
  # source of truth, and the no-dependency CLI must load + render help.
  launcher:
    executor: node
    steps:
      - checkout
      - run:
          name: Bundled compose is in sync
          working_directory: cli
          command: node scripts/sync-assets.js --check
      - run:
          name: CLI loads + help renders
          working_directory: cli
          command: |
            node -e "require('./lib/commands');require('./lib/docker');require('./lib/source')"
            node bin/cascadia.js help >/dev/null

  # Build + push the 6 demo/live images as multi-arch (amd64 + arm64) to GHCR.
  # Runs ONLY on a `v*` git tag, after the test jobs pass. A machine executor is
  # required: the container `docker:` executors can't run buildx + QEMU.
  # Needs CircleCI project env vars GHCR_USER + GHCR_TOKEN (PAT, write:packages).
  publish-images:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Log in to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Enable multi-arch (QEMU + buildx)
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use --name cascadia-builder
      - run:
          name: Build + push (amd64 + arm64)
          command: |
            set -euo pipefail
            REG=ghcr.io/cxk280
            for s in proxy mock-upstream judge-worker policy-controller dashboard-api dashboard; do
              echo ">> building cascadia-$s"
              docker buildx build --platform linux/amd64,linux/arm64 \
                -f deploy/docker/$s.Dockerfile \
                -t "$REG/cascadia-$s:${CIRCLE_TAG}" \
                -t "$REG/cascadia-$s:latest" \
                --push .
            done

workflows:
  build-test-deploy:
    jobs:
      - rust:
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-judge-worker
          service: judge-worker
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-policy-controller
          service: policy-controller
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-dashboard-api
          service: dashboard-api
          filters: { tags: { only: /^v.*/ } }
      - dashboard:
          filters: { tags: { only: /^v.*/ } }
      - launcher:
          filters: { tags: { only: /^v.*/ } }

      # --- release: build + push images on a v* tag, after tests pass ---
      - publish-images:
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
            - launcher
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      # --- dev: automatic on merge to main, after tests pass ---
      - deploy:
          name: deploy-dev
          env: dev
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
          filters:
            branches:
              only: main

      # --- staging: behind a manual approval gate ---
      - hold-staging:
          type: approval
          requires:
            - deploy-dev
          filters:
            branches:
              only: main
      - deploy:
          name: deploy-staging
          env: staging
          requires:
            - hold-staging
          filters:
            branches:
              only: main

      # --- prod: behind a second manual approval gate ---
      - hold-prod:
          type: approval
          requires:
            - deploy-staging
          filters:
            branches:
              only: main
      - deploy:
          name: deploy-prod
          env: prod
          requires:
            - hold-prod
          filters:
            branches:
              only: main
