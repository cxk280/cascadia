version: 2.1

# Cascadia CI/CD.
#
#   Every push / PR : build + test (rust, the three python services, dashboard).
#   On `main` only  : deploy to Railway dev (automatic) → staging (manual
#                     approval gate) → prod (manual approval gate).
#   On `v2` only    : deploy to the isolated Railway `v2` preview environment
#                     (automatic, after tests) — the integration branch for
#                     in-progress feature work, never the live dev/staging/prod.
#   On main / v2    : also publish moving GHCR image tags (main → :edge, v2 → :v2)
#                     so the launcher's images track the code without a release.
#                     Pinned `v*` + :latest images are cut only on a v* tag.
#
# Railway auth comes from CircleCI project env vars:
#   RAILWAY_API_TOKEN   — a Railway account/team token with access to the project
#                         (the Railway CLI reads this automatically)
#   RAILWAY_PROJECT_ID  — the project id (2b6a4e7f-14d6-496e-847c-9922411dfed3)

executors:
  rust:
    docker:
      - image: cimg/rust:1.83
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
    environment:
      CASCADIA_DATABASE_URL: postgres://cascadia:cascadia@localhost:5432/cascadia
      RUSTFLAGS: "-D warnings"
  python:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
    environment:
      CASCADIA_DATABASE_URL: postgres://cascadia:cascadia@localhost:5432/cascadia
  node:
    docker:
      - image: cimg/node:20.11

jobs:
  rust:
    executor: rust
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
      - run:
          name: Toolchain components
          command: rustup component add clippy rustfmt
      - run:
          name: Format check
          command: cargo fmt --all -- --check
      - run:
          name: Clippy (deny warnings)
          command: cargo clippy --workspace --all-targets -- -D warnings
      - run:
          name: Test
          command: cargo test --workspace --no-fail-fast
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  python:
    executor: python
    parameters:
      service:
        type: string
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install --user uv
      - run:
          name: Sync + test (<< parameters.service >>)
          working_directory: services/<< parameters.service >>
          command: |
            uv sync --extra dev
            uv run pytest -q

  dashboard:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "dashboard/package-lock.json" }}
      - run:
          name: Install deps
          working_directory: dashboard
          command: npm ci
      - run:
          name: Typecheck
          working_directory: dashboard
          command: npm run typecheck
      - run:
          name: Build
          working_directory: dashboard
          command: npm run build
      - save_cache:
          key: npm-v1-{{ checksum "dashboard/package-lock.json" }}
          paths:
            - dashboard/node_modules

  deploy:
    executor: node
    parameters:
      env:
        type: string
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          # cimg/node runs as non-root; global npm install needs sudo
          # (passwordless on cimg images).
          command: sudo npm i -g @railway/cli@latest
      - run:
          name: Deploy services to << parameters.env >>
          command: |
            set -euo pipefail
            : "${RAILWAY_API_TOKEN:?set RAILWAY_API_TOKEN in CircleCI project env vars}"
            : "${RAILWAY_PROJECT_ID:?set RAILWAY_PROJECT_ID in CircleCI project env vars}"
            # Deploy backends first; the dashboard LAST. Its Railway health
            # check is `/` — a server-rendered page that fetches from the
            # backend — so deploying it before the proxy/api finish restarting
            # races the health check and fails the deploy.
            for svc in \
              cascadia-proxy \
              cascadia-dashboard-api \
              cascadia-judge-worker \
              cascadia-policy-controller \
              cascadia-dashboard; do
              echo ">> deploying $svc → << parameters.env >>"
              railway up --ci \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "<< parameters.env >>" \
                --service "$svc"
            done

  # Launcher (cli/) sanity: the bundled demo compose must match the in-tree
  # source of truth, and the no-dependency CLI must load + render help.
  launcher:
    executor: node
    steps:
      - checkout
      - run:
          name: Bundled compose is in sync
          working_directory: cli
          command: node scripts/sync-assets.js --check
      - run:
          name: CLI loads + help renders
          working_directory: cli
          command: |
            node -e "require('./lib/commands');require('./lib/docker');require('./lib/source')"
            node bin/cascadia.js help >/dev/null
      - run:
          name: On a v* tag, the tag must match the launcher version
          working_directory: cli
          command: |
            # The image tag is tied to the launcher version (launcher x.y.z pulls
            # vx.y.z images). On a release tag, refuse to build if they diverge.
            if [ -n "${CIRCLE_TAG:-}" ]; then
              want="v$(node -p "require('./package.json').version")"
              if [ "$CIRCLE_TAG" != "$want" ]; then
                echo "Tag $CIRCLE_TAG != launcher version $want — bump cli/package.json or fix the tag."; exit 1
              fi
              echo "OK: $CIRCLE_TAG matches launcher version."
            fi

  # Build all 6 images for ONE architecture NATIVELY (no QEMU) and push each by
  # DIGEST (no tag). Fanned out across an x86 runner and a CircleCI Arm runner in
  # parallel; the digests are handed to `merge-manifests` via the workspace,
  # which stitches them into multi-arch manifest lists — so the registry only
  # ever holds the tagged multi-arch image, no per-arch tag clutter. Native arm64
  # avoids the QEMU emulation that blew the 1-hour job limit (one emulated job).
  # Needs CircleCI project env vars GHCR_USER + GHCR_TOKEN (PAT, write:packages).
  build-arch:
    machine:
      image: ubuntu-2204:current
    resource_class: << parameters.rc >>
    parameters:
      arch:
        type: string
      rc:
        type: string
    steps:
      - checkout
      - run:
          name: Log in to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: buildx (docker-container driver — native << parameters.arch >>, no QEMU)
          command: docker buildx create --name cascadia --driver docker-container --use --bootstrap
      - run:
          name: Build + push by digest (<< parameters.arch >>)
          no_output_timeout: 40m
          command: |
            set -euo pipefail
            if ! command -v jq >/dev/null; then sudo apt-get update -y && sudo apt-get install -y jq; fi
            REG=ghcr.io/cxk280
            mkdir -p /tmp/digests
            for s in proxy mock-upstream judge-worker policy-controller dashboard-api dashboard; do
              echo ">> building cascadia-$s (<< parameters.arch >>)"
              # push-by-digest pushes the image with NO tag — only the final
              # multi-arch manifest (merge-manifests) gets a tag, so no per-arch
              # :<tag>-amd64 / :<tag>-arm64 clutter is left in the registry.
              docker buildx build --platform "linux/<< parameters.arch >>" \
                -f deploy/docker/$s.Dockerfile \
                --output "type=image,name=$REG/cascadia-$s,push-by-digest=true,push=true" \
                --metadata-file /tmp/md.json .
              jq -r '."containerimage.digest"' /tmp/md.json > "/tmp/digests/$s.<< parameters.arch >>"
            done
      - persist_to_workspace:
          root: /tmp/digests
          paths:
            - "."

  # Stitch the per-arch images (referenced by DIGEST — no per-arch tags exist)
  # into multi-arch manifest lists. Manifests only, so it's fast. Two modes via
  # `moving_tag`:
  #   - empty (release, on a v* tag): tag :${CIRCLE_TAG} + :latest (pinned).
  #   - set   (edge, on a branch):    tag ONLY the moving tag — never :latest, so
  #     the launcher's version-pinned reproducibility (PLAN.md §9 2026-06-06,
  #     `PUBLISHED_IMAGE_TAG = v<launcher version>`) is never undermined by
  #     unreleased branch code sliding under :latest.
  merge-manifests:
    machine:
      image: ubuntu-2204:current
    parameters:
      moving_tag:
        type: string
        default: ""
    steps:
      - attach_workspace:
          at: /tmp/digests
      - run:
          name: Log in to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Create + push multi-arch manifests (from digests)
          command: |
            set -euo pipefail
            REG=ghcr.io/cxk280
            MOVING="<< parameters.moving_tag >>"
            for s in proxy mock-upstream judge-worker policy-controller dashboard-api dashboard; do
              amd=$(cat "/tmp/digests/$s.amd64")
              arm=$(cat "/tmp/digests/$s.arm64")
              if [ -n "$MOVING" ]; then
                # Edge/branch build: one moving tag, NOT :latest (release-only).
                docker buildx imagetools create \
                  -t "$REG/cascadia-$s:$MOVING" \
                  "$REG/cascadia-$s@$amd" \
                  "$REG/cascadia-$s@$arm"
              else
                # Release build (v* tag): the pinned version tag + :latest.
                docker buildx imagetools create \
                  -t "$REG/cascadia-$s:${CIRCLE_TAG}" \
                  -t "$REG/cascadia-$s:latest" \
                  "$REG/cascadia-$s@$amd" \
                  "$REG/cascadia-$s@$arm"
              fi
            done

workflows:
  build-test-deploy:
    jobs:
      - rust:
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-judge-worker
          service: judge-worker
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-policy-controller
          service: policy-controller
          filters: { tags: { only: /^v.*/ } }
      - python:
          name: test-dashboard-api
          service: dashboard-api
          filters: { tags: { only: /^v.*/ } }
      - dashboard:
          filters: { tags: { only: /^v.*/ } }
      - launcher:
          filters: { tags: { only: /^v.*/ } }

      # --- release: native per-arch builds (parallel) → manifest merge, on a v* tag ---
      - build-arch:
          name: build-amd64
          arch: amd64
          rc: large
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
            - launcher
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-arch:
          name: build-arm64
          arch: arm64
          rc: arm.large
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
            - launcher
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - merge-manifests:
          requires:
            - build-amd64
            - build-arm64
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      # --- edge images: on every merge to main / v2, build the same multi-arch
      #     images and publish a MOVING tag (main → :edge, v2 → :v2) so the
      #     published GHCR images track the code automatically, no release needed.
      #     `v*` + :latest stay release-only/pinned (PLAN.md §9 2026-06-06). Run
      #     current code with: CASCADIA_TAG=edge npx cascadia-gateway demo. Cost:
      #     one native multi-arch image build per merge to main/v2 (not PRs). ---
      - build-arch:
          name: build-amd64-edge
          arch: amd64
          rc: large
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
            - launcher
          filters:
            branches:
              only: [main, v2]
      - build-arch:
          name: build-arm64-edge
          arch: arm64
          rc: arm.large
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
            - launcher
          filters:
            branches:
              only: [main, v2]
      - merge-manifests:
          name: merge-manifests-edge-main
          moving_tag: edge
          requires:
            - build-amd64-edge
            - build-arm64-edge
          filters:
            branches:
              only: main
      - merge-manifests:
          name: merge-manifests-edge-v2
          moving_tag: v2
          requires:
            - build-amd64-edge
            - build-arm64-edge
          filters:
            branches:
              only: v2

      # --- dev: automatic on merge to main, after tests pass ---
      - deploy:
          name: deploy-dev
          env: dev
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
          filters:
            branches:
              only: main

      # --- staging: behind a manual approval gate ---
      - hold-staging:
          type: approval
          requires:
            - deploy-dev
          filters:
            branches:
              only: main
      - deploy:
          name: deploy-staging
          env: staging
          requires:
            - hold-staging
          filters:
            branches:
              only: main

      # --- prod: behind a second manual approval gate ---
      - hold-prod:
          type: approval
          requires:
            - deploy-staging
          filters:
            branches:
              only: main
      - deploy:
          name: deploy-prod
          env: prod
          requires:
            - hold-prod
          filters:
            branches:
              only: main

      # --- v2 preview: automatic on merge to the `v2` integration branch, after
      #     tests pass. Deploys to the isolated `v2` Railway environment (forked
      #     from dev, scale-to-zero) in the same project — no new CircleCI secrets
      #     needed (same RAILWAY_PROJECT_ID/token). Mirrors deploy-dev but gated on
      #     the v2 branch, so in-progress feature work is previewable without ever
      #     touching the live dev/staging/prod envs (those stay on `main`). When v2
      #     is complete it merges to main + cuts a v* tag for the major release. ---
      - deploy:
          name: deploy-v2
          env: v2
          requires:
            - rust
            - test-judge-worker
            - test-policy-controller
            - test-dashboard-api
            - dashboard
          filters:
            branches:
              only: v2
