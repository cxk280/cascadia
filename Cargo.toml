[workspace]
resolver = "2"
members = [
    "crates/proxy",
    "crates/mock-upstream",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Chris King <chris@cking.me>"]
repository = "https://github.com/cascadia-llm/cascadia"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
hyper = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
once_cell = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"
rand = "0.8"
arc-swap = "1"
twox-hash = "1"
futures-util = "0.3"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
